            "recipeInstructions": [

              { "@type": "HowToStep", "text": "Add the red lentils and 1 litre of water." },
              { "@type": "HowToStep", "text": "Bring to a boil, then simmer for 20 minutes." },
              { "@type": "HowToStep", "text": "Season with salt to taste." },
